run_id: attr_head_v2
module: attribute_resnet18_head_tune
model: ResNet18
pretrained_weight: ImageNet
train_strategy: head_tune
image_size: 224
epochs: 15
batch_size_shape: 32
batch_size_color: 64
learning_rate: 0.001
optimizer: adamw
scheduler: ReduceLROnPlateau
seed: 42
frozen_backbone: true
trainable_layers:
- classification_heads
tasks:
- shape
- color
label_mapping_file: data/processed/nih_attribute/label_mapping.json
dataset:
  name: NIH PILL IMAGE
  split_file: data/splits/nih_attribute
augmentation:
  enabled: true
  online: false
  sim2real: true
