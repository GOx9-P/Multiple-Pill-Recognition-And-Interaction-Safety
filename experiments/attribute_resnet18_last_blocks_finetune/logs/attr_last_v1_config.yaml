augmentation:
  enabled: true
  split: train_only
model:
  architecture: ResNet18
  pretrained_from: /kaggle/input/datasets/thuongnguoiquantu/head-1/best_heads_finetuned
    (1).pth
module: attribute_resnet18_last_blocks_finetune
run_id: attr_last_v1
seed: 42
trainable_layers:
- layer4
- fc_shape
- fc_color
training:
  batch_size: 32
  epochs: 15
  image_size: 224
  lr_backbone: 1.0e-05
  lr_heads: 0.0001
  optimizer: AdamW
  scheduler: ReduceLROnPlateau
