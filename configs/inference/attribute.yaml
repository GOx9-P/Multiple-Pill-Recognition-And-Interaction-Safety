# Đổi toàn bộ nhóm đường dẫn này sang attribute_resnet18_head_tune khi benchmark
# cho thấy head-tune tốt hơn; code inference không cần thay đổi.
model:
  selected_model: attribute_resnet18_last_blocks_finetune
  weights_path: models/attribute_resnet18_last_blocks_finetune/best.pt
  label_mapping_path: models/attribute_resnet18_last_blocks_finetune/label_mapping.json
  color_thresholds_path: models/attribute_resnet18_last_blocks_finetune/optimal_thresholds.json
  model_config_path: models/attribute_resnet18_last_blocks_finetune/model_config.yaml
  device: auto
  image_size: 224
  shape_top_k: 3

preprocessing:
  # Phải khớp transform validation/inference của ResNet18 đã train.
  normalization_mean: [0.485, 0.456, 0.406]
  normalization_std: [0.229, 0.224, 0.225]

artifacts:
  output_dir: outputs
